[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tauon"
version = "0.1.0"
description = "A minimal Python agent framework built on tau-ai."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "pydantic>=2.11",
    "tau-ai>=0.3.3",
    "typer>=0.12",
]

[project.scripts]
tauon = "tauon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.5",
    "ty>=0.0.63",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tauon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["plan.md", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
